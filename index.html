<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viral AI Instagram Bio Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --primary: #ff6b6b;
            --accent: #4ecca3;
            --text-light: #e0e0e0;
            --text-muted: #b0b0b0;
            --transition: 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        h1 {
            font-weight: 600;
            margin: 1rem 0;
            text-align: center;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: var(--transition);
        }

        .glass:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            background: rgba(255,255,255,0.1);
            color: var(--text-light);
            font-family: 'Roboto', sans-serif;
            resize: vertical;
            min-height: 80px;
            transition: var(--transition);
        }

        textarea:focus, input:focus {
            outline: none;
            background: rgba(255,255,255,0.15);
        }

        .btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 1.6rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #output {
            margin-top: 1.5rem;
            background: rgba(255,255,255,0.07);
            border-radius: 0.5rem;
            padding: 1rem;
            min-height: 80px;
            font-family: 'Roboto', sans-serif;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Ad placeholders */
        #ad-slot-top, #ad-slot-bottom {
            width: 100%;
            max-width: 728px;
            height: 90px;
            background: #222;
            border: 2px dashed #444;
            border-radius: 0.5rem;
            margin: 1rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .glass {
                padding: 1.5rem;
            }
            #ad-slot-top, #ad-slot-bottom {
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <div id="ad-slot-top">Ad Slot Top (Adsterra / Monetag)</div>

    <h1>Viral AI Instagram Bio Generator</h1>

    <section class="glass">
        <label for="niche">Your Niche / Profession</label>
        <input type="text" id="niche" placeholder="e.g., Travel Blogger, Fitness Coach">

        <label for="keywords">Key Interests / Keywords (comma separated)</label>
        <textarea id="keywords" placeholder="e.g., adventure, healthy living, sunrise"></textarea>

        <button class="btn" id="generateBtn">Generate Bio</button>

        <div id="output" class="glass"></div>
    </section>

    <div id="ad-slot-bottom">Ad Slot Bottom (Adsterra / Monetag)</div>

    <script>
        // Simple template based "AI"
        const templates = [
            "✨ {niche} ✨\n{keywords}\n📍 Based in {location}\n🔗 Link in bio!",
            "🚀 {niche} on a mission to {goal}\n💡 {keywords}\n💬 DM for collaborations",
            "🎯 {niche} | {keywords}\n🌍 Exploring the world one {keyword} at a time.\n🗓️ New posts every {frequency}",
            "💥 {niche}\n🔥 {keywords}\n📸 Capturing moments that tell a story.\n👇 Check my latest work!",
            "🧭 {niche} • {keywords}\n🤝 Partner with me: {email}\n🛒 Shop my picks below!"
        ];

        const locations = ["New York", "Los Angeles", "London", "Paris", "Tokyo", "Sydney", "Berlin"];
        const frequencies = ["day", "week", "month", "weekend"];
        const emails = ["hello@example.com", "contact@mydomain.com", "info@mybrand.com"];

        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateBio() {
            const niche = document.getElementById('niche').value.trim() || "Creator";
            const rawKeywords = document.getElementById('keywords').value.trim();
            const kwArray = rawKeywords ? rawKeywords.split(',').map(k => k.trim()).filter(k => k) : ["passion", "creativity"];
            const keywords = kwArray.slice(0, 3).join(', ');
            const keyword = kwArray[0] || "magic";

            const template = randomItem(templates);
            const bio = template
                .replace(/{niche}/g, niche)
                .replace(/{keywords}/g, keywords)
                .replace(/{keyword}/g, keyword)
                .replace(/{location}/g, randomItem(locations))
                .replace(/{goal}/g, "inspire others")
                .replace(/{frequency}/g, randomItem(frequencies))
                .replace(/{email}/g, randomItem(emails));

            document.getElementById('output').textContent = bio;
        }

        document.getElementById('generateBtn').addEventListener('click', generateBio);

        // Optional: generate on Enter key in textarea
        document.getElementById('keywords').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                generateBio();
            }
        });
    </script>
</body>
</html>
