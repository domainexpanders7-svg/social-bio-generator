<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral AI Instagram Bio Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0c10;
            --card-bg: rgba(255,255,255,0.08);
            --card-border: rgba(255,255,255,0.12);
            --accent: #66fcf1;
            --text-light: #c5c6c7;
            --text-primary: #fff;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        header, footer { width: 100%; max-width: 800px; margin: 0.5rem 0; }
        #ad-slot-top, #ad-slot-bottom {
            width: 100%;
            height: 90px;
            background: #1f2833;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: .9rem;
            border-radius: .5rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,.4);
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            color: var(--accent);
            margin-bottom: .5rem;
        }
        textarea, input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--card-border);
            border-radius: .5rem;
            color: var(--text-primary);
            padding: .8rem 1rem;
            font-size: 1rem;
            resize: vertical;
            transition: background .3s ease, border .3s ease;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
        button {
            background: var(--accent);
            border: none;
            border-radius: .5rem;
            color: var(--bg-dark);
            padding: .8rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background .3s ease, transform .2s;
        }
        button:hover {
            background: #45b0a2;
            transform: translateY(-2px);
        }
        .output {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--card-border);
            border-radius: .5rem;
            padding: 1rem;
            min-height: 120px;
            white-space: pre-wrap;
            word-break: break-word;
            position: relative;
        }
        .copy-btn {
            position: absolute;
            top: .5rem;
            right: .5rem;
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: .3rem;
            color: var(--text-primary);
            font-size: .85rem;
            cursor: pointer;
            padding: .2rem .5rem;
            transition: background .2s;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.25); }
        @media (max-width:600px){
            .card { padding:1.5rem; }
            h1{font-size:1.5rem;}
        }
    </style>
</head>
<body>
    <header id="ad-slot-top">[Ad Slot Top – Adsterra / Monetag]</header>

    <section class="card">
        <h1>Viral AI Instagram Bio Generator</h1>

        <label for="keywords">Enter your interests/keywords (comma separated):</label>
        <input type="text" id="keywords" placeholder="e.g., travel, photography, coffee">

        <button id="generateBtn">Generate Bio</button>

        <div class="output" id="bioOutput">
            <button class="copy-btn" id="copyBtn">Copy</button>
            <span id="bioText">Your generated bio will appear here...</span>
        </div>
    </section>

    <footer id="ad-slot-bottom">[Ad Slot Bottom – Adsterra / Monetag]</footer>

    <script>
        const templates = [
            "✨ {0} enthusiast | 📍 {1} | 🎯 Living for {2}",
            "🔹 {0} lover | 🌍 Exploring {1} | ☕ Powered by {2}",
            "🖤 {0} + {1} + {2} = My vibe",
            "🚀 {0} addict | 🌟 {1} dreamer | 🎧 {2} soundtrack",
            "💡 {0} creator | 🎨 {1} aficionado | 🍰 {2} connoisseur",
            "🌈 {0} + {1} = {2} magic",
            "🔥 {0} junkie | 📸 Capturing {1} | 🍹 Sipping {2}"
        ];

        const generateBtn = document.getElementById('generateBtn');
        const keywordsInput = document.getElementById('keywords');
        const bioOutput = document.getElementById('bioText');
        const copyBtn = document.getElementById('copyBtn');

        function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

        function generateBio(){
            const raw = keywordsInput.value.trim();
            if(!raw){
                bioOutput.textContent = "Please enter at least one keyword.";
                return;
            }
            const words = raw.split(',').map(w=>w.trim()).filter(Boolean);
            // Ensure we have at least 3 items for placeholders; repeat if needed
            const filler = ["life", "style", "vibes", "moments", "adventure", "energy"];
            while(words.length < 3) words.push(randomChoice(filler));

            const template = randomChoice(templates);
            // replace placeholders {0},{1},{2}
            const bio = template.replace('{0}', words[0])
                                .replace('{1}', words[1] || randomChoice(filler))
                                .replace('{2}', words[2] || randomChoice(filler));
            bioOutput.textContent = bio;
        }

        function copyBio(){
            const text = bioOutput.textContent;
            if(!text || text.startsWith("Please")) return;
            navigator.clipboard.writeText(text).then(()=>{
                copyBtn.textContent = "Copied!";
                setTimeout(()=>{ copyBtn.textContent = "Copy"; },1500);
            });
        }

        generateBtn.addEventListener('click', generateBio);
        copyBtn.addEventListener('click', copyBio);
        // Allow Enter key in input to trigger generation
        keywordsInput.addEventListener('keypress', e=>{ if(e.key === 'Enter'){ e.preventDefault(); generateBio(); } });
    </script>
</body>
</html>
